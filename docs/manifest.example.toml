# manifest.toml: what goes into the HapSearch database.
#
# Save this as data/hapSearch/manifest.toml (or {species}/data/hapSearch/) in the data repository
# (Breeding-Insight/alfalfa_haplotype_db), next to the HapSearch inputs.
# scripts/build_database.py in the HapSearch app repository reads it; see
# docs/updating-data.md there.
#
# Written once: with the patterns below, adding or replacing files is enough
# and this file does not need editing. Which FASTA version is published is set
# in HapSearch's data_sources.toml, not here.
#
# Paths are relative to this file's folder. A path starting with "/" is
# relative to the repository root (used here for the FASTA in data/versions/). Wildcards (*)
# are allowed in other paths; a single-file pattern must match exactly one file. Matrices may be gzipped
# (.csv.gz); gzip anything over ~50 MB, since GitHub rejects files over 100 MB.
#
# Expected layout of data/hapSearch/:
#   manifest.toml
#   HapSearch_mapping.csv
#   HapSearch_owner_contacts.csv
#   <probe design>.botloci
#   sample_hapStatus/   one *_hapStatus.csv per genotyping order
#   hapPA/              *_hapPA_matrix.csv per FASTA version

[metadata]
# One row per genotyping source (the DAl... token in sample file names):
# genotyping_source,project_code,owner_name,project_name,description
project_mapping = "HapSearch_mapping.csv"
# One row per owner named in the mapping (Full Name, emails, ORCiD, employer, ...).
owner_contacts = "HapSearch_owner_contacts.csv"

[[species]]
name = "Medicago sativa"
common_name = "Alfalfa"
# The allele database; its version defines the data version. {version} is
# filled in from "version" in HapSearch's data_sources.toml (e.g. v055), or the
# newest version present when none is pinned. It only matches a version token,
# so files like alfalfa_allele_db_v016_81bp.fa are never picked.
fasta = "/data/versions/alfalfa_allele_db_{version}.fa"
# Optional: bottom-strand marker IDs, one per line. Keep a single .botloci file.
botloci = "*.botloci"
# A folder (every .csv/.csv.gz/.tsv inside is imported), a file, or a list.
# Every file name's DAl... token needs a row in HapSearch_mapping.csv.
sample_presence = "sample_hapStatus"
# Optional project-level matrix (columns are projects). {fasta} is the chosen
# FASTA's name without extension, so the matrix always matches the FASTA
# version; the build stops if that version has no matrix. The
# *_fileList.txt files are not needed by the build.
project_presence = "hapPA/{fasta}_hapPA_matrix.csv"

# Another species gets its own {species}/data/hapSearch/ folder; to build them
# into one database, add another [[species]] block with "/"-rooted paths.

[checks]
# Fail the build when more than this share of a matrix's alleles are missing
# from the FASTA, which usually means the FASTA version does not match the calls.
max_skipped_allele_fraction = 0.04
