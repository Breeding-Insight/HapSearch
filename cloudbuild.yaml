# Builds the HapSearch database from the species data repositories and FASTA
# versions pinned in data_sources.toml, then builds and deploys the app. Run it
# manually from the Cloud Build trigger. To build one species at another
# version without editing data_sources.toml, set _VERSIONS (e.g.
# "alfalfa=v056"); _REFS does the same for the git ref. See docs/updating-data.md.
#
# Everything it needs (secrets, service accounts, Firestore, Artifact Registry)
# is created once by scripts/setup_cloud_run.sh; see docs/cloud-run.md.
#
# Data repositories are read through Cloud Build's GitHub connection (the
# "Google Cloud Build" GitHub App): link each one to the connection under the
# name given as `link` in data_sources.toml, and each build gets short-lived
# read-only tokens. No personal tokens are stored.
substitutions:
  _REGION: us-west1
  _REPOSITORY: hapsearch
  _SERVICE: hapsearch
  # One-off overrides, e.g. "alfalfa=v056" / "alfalfa=master"; empty uses
  # what data_sources.toml pins. Separate several species with commas.
  _VERSIONS: ""
  _REFS: ""
  # Cloud Build 2nd-gen GitHub connection holding the linked data repositories.
  _GITHUB_CONNECTION: github
  _FIRESTORE_DATABASE: hapsearch-db
  # Public landing page (landing/ on GitHub Pages). Signed-out visitors and
  # sign-outs are sent here; empty sends visitors straight to ORCID sign-in.
  _LANDING_URL: "https://breeding-insight.github.io/HapSearch/"
  # "true" imports every species from scratch instead of starting from the
  # last published database (see scripts/incremental_build.py).
  _FULL_REBUILD: "false"

steps:
  # 0. Fetch the database the last successful build published, so this build
  #    only imports the species whose data changed. The bucket is created by
  #    scripts/setup_cloud_run.sh; without a published database (or with
  #    _FULL_REBUILD=true) every species is imported.
  - id: fetch-previous-database
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if [[ "${_FULL_REBUILD}" == "true" ]]; then
          echo "_FULL_REBUILD=true: importing every species"
        elif gcloud storage objects describe "gs://${PROJECT_ID}-hapsearch-build/hapsearch.db" > /dev/null 2>&1; then
          gcloud storage cp "gs://${PROJECT_ID}-hapsearch-build/hapsearch.db" /builder/home/previous.db
        else
          echo "No published database in gs://${PROJECT_ID}-hapsearch-build yet: importing every species"
        fi

  # 1. Fetch every data source at its ref, then build and check the database.
  #    The build stops here if any import or check fails, so nothing is
  #    deployed. Sources are fetched outside /workspace to keep them out of the
  #    Docker build context.
  #    Microhaplotypes are aligned to their Ref in R with BIGr's settings
  #    (scripts/align_microhaplotypes.R); Debian trixie packages pwalign, so the
  #    image is pinned to trixie.
  - id: build-database
    name: python:3.13-slim-trixie
    entrypoint: bash
    env:
      - HAPSEARCH_BUILD_CONNECTION=projects/${PROJECT_ID}/locations/${_REGION}/connections/${_GITHUB_CONNECTION}
      - DEBIAN_FRONTEND=noninteractive
    args:
      - -c
      - |
        set -euo pipefail
        # git fetches the data sources; R and pwalign align the microhaplotypes.
        apt-get update -qq && apt-get install -y -qq --no-install-recommends \
          git r-base-core r-bioc-pwalign > /dev/null
        pip install --quiet --root-user-action=ignore -r requirements.txt
        reuse=""
        if [[ -f /builder/home/previous.db ]]; then
          reuse="--reuse=/builder/home/previous.db"
        fi
        python -W ignore scripts/build_database.py \
          $${reuse:+"$$reuse"} \
          --sources data_sources.toml \
          --versions "${_VERSIONS}" \
          --refs "${_REFS}" \
          --cache-dir /builder/home/build-cache \
          --version-file /builder/home/data_version.txt \
          --output data/hapsearch.db

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}

  # Every service setting lives here, so the first run creates a fully
  # configured service and later runs keep it that way. The data versions
  # (source=version/ref@commit) are recorded on the revision as
  # HAPSEARCH_DATA_VERSION.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        version="$$(cat /builder/home/data_version.txt)"
        echo "Deploying data: $${version}"
        gcloud run deploy "${_SERVICE}" \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}" \
          --region="${_REGION}" \
          --platform=managed \
          --service-account="hapsearch-cloud-run@${PROJECT_ID}.iam.gserviceaccount.com" \
          --allow-unauthenticated \
          --port=8080 \
          --cpu=1 \
          --memory=1Gi \
          --cpu-throttling \
          --cpu-boost \
          --min-instances=0 \
          --max-instances=3 \
          --execution-environment=gen2 \
          --update-env-vars="APP_ENV=production,DEBUG_MODE=false,TLS_ENABLED=false,GOOGLE_CLOUD_PROJECT=${PROJECT_ID},FIRESTORE_DATABASE=${_FIRESTORE_DATABASE},HAPSEARCH_LANDING_URL=${_LANDING_URL},HAPSEARCH_DATA_VERSION=$${version}" \
          --update-secrets="SECRET_KEY=hapsearch-secret-key:latest,ORCID_CLIENT_ID=hapsearch-orcid-client-id:latest,ORCID_CLIENT_SECRET=hapsearch-orcid-client-secret:latest" \
          --quiet

  # 5. Publish the database that is now live, for the next build to start from.
  #    Runs only after a successful deploy.
  - id: publish-database
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        if ! gcloud storage cp data/hapsearch.db "gs://${PROJECT_ID}-hapsearch-build/hapsearch.db"; then
          echo "The new version is deployed, but the database could not be saved to"
          echo "gs://${PROJECT_ID}-hapsearch-build, so the next build will import every species."
          echo "Re-run scripts/setup_cloud_run.sh to create the bucket and grant access."
          exit 1
        fi

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${BUILD_ID}

# A full build of every species can take a while; the default limit is 60 min.
timeout: 7200s

options:
  logging: CLOUD_LOGGING_ONLY
  # Ignore substitutions set on the trigger that this file no longer uses.
  substitutionOption: ALLOW_LOOSE
