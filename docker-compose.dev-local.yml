name: haplosearch_dev_local

services:
  haplosearch:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5000:5000"
    volumes:
      # Mount everything for live reload during development
      - ./app.py:/app/app.py
      - ./config.py:/app/config.py
      - ./dash_app.py:/app/dash_app.py
      - ./schema_sqlite.sql:/app/schema_sqlite.sql
      - ./database:/app/database
      - ./design:/app/design
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./assets:/app/assets
      - ./static:/app/static
      - ./pages:/app/pages
      - ./auth:/app/auth
      - ./templates:/app/templates
      - ./alignment:/app/alignment
    env_file:
      - .env.development.local
    environment:
      - APP_ENV=local-dev
      - DEBUG_MODE=true
      - APP_PORT=5000
      - SQLITE_DB_PATH=/app/data/hapsearch.db
      - SQLITE_READ_ONLY=false
      - BYPASS_ORCID_AUTH=true
      - BYPASS_AUTH_WHITELIST=false
    restart: unless-stopped
