name: haplosearch_prod

services:
  haplosearch:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5080:5000"
    volumes:
      - ./database:/app/database
      - ./design:/app/design
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./assets:/app/assets
      - /etc/ssl/certs/ifs-brin-01.pem:/cert.pem:ro
      - /etc/ssl/private/ifs-brin-01.key:/key.pem:ro
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - DEBUG_MODE=false
      - APP_PORT=5000
      - BYPASS_ORCID_AUTH=false
      - BYPASS_AUTH_WHITELIST=false
      - TLS_ENABLED=true
      - TLS_CERT_PATH=/cert.pem
      - TLS_KEY_PATH=/key.pem
    restart: unless-stopped
