name: haplosearch_dev

services:
  haplosearch:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    ports:
      - "5000:5000"
    volumes:
      # Mount everything for live reload during development
      - ./app.py:/app/app.py
      - ./config.py:/app/config.py
      - ./dash_app.py:/app/dash_app.py
      - ./schema_mssql.sql:/app/schema_mssql.sql
      - ./database:/app/database
      - ./design:/app/design
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./assets:/app/assets
      - ./static:/app/static
      - ./pages:/app/pages
      - ./auth:/app/auth
      - ./templates:/app/templates
      - ./alignment:/app/alignment
      - /srv/hapsearch/development/presence_absence:/app/data/presence_absence
      - /srv/hapsearch/development/presence_artifacts:/srv/hapsearch/development/presence_artifacts
      - /etc/ssl/certs/ifs-brin-01.pem:/cert.pem:ro
      - /etc/ssl/private/ifs-brin-01.key:/key.pem:ro
    env_file:
      - .env.development
    environment:
      - APP_ENV=development
      - DEBUG_MODE=true
      - APP_PORT=5000
      - MSSQL_DRIVER=ODBC Driver 18 for SQL Server
      - PRESENCE_ARTIFACT_DIR=/srv/hapsearch/development/presence_artifacts
      - BYPASS_ORCID_AUTH=false
      - BYPASS_AUTH_WHITELIST=false
      - TLS_ENABLED=true
      - TLS_CERT_PATH=/cert.pem
      - TLS_KEY_PATH=/key.pem
    restart: unless-stopped
